name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. A half-finished deploy on event night would be bad.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 22, not 20. Node 20 is past end of life, and it is also the version that broke this
      # workflow the first time it ran the render tests: `navigator` only became a Node
      # global in v21, pixi.js reads it at import, and the tests passed on a developer's
      # Node 24 while dying here. Those tests now declare `@vitest-environment jsdom` so
      # they no longer depend on it either way — this keeps CI on a supported runtime and
      # closer to what the code is actually developed against.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Roughly three minutes, and worth every second: this suite contains the golden
      # record tests. A recorded event replays from a seed, so any silent change to the
      # physics or the PRNG would turn an existing recording into a different event.
      # These tests are what makes that fail loudly instead of quietly.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
